name: Lint

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Node Packages
        run: npm ci
      # Guards against eslint-baseline.json being raised directly on this PR
      # branch (rather than earned via `npm run lint:baseline:bump:<project>`)
      # in the same change that introduces new warnings.
      - name: Guard against a raised ESLint warning baseline
        if: github.event_name == 'pull_request'
        run: |
          git show "${{ github.event.pull_request.base.sha }}:eslint-baseline.json" > /tmp/base-eslint-baseline.json 2>/dev/null || echo '{}' > /tmp/base-eslint-baseline.json
          node scripts/check-baseline-not-increased.mjs /tmp/base-eslint-baseline.json eslint-baseline.json
      - name: Run lint baseline scripts' own tests
        run: npm run test:scripts
      - name: Check formatting
        run: npm run format:check
      # `npm run lint:baseline` already runs `ng lint` (via lint:report) for
      # every project before checking the ceiling, so a separate `npm run
      # lint` step here would lint each project twice.
      - name: Lint all five projects against their warning baselines
        run: npm run lint:baseline
