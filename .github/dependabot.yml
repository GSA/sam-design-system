version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    cooldown:
      default-days: 5
      semver-major-days: 60
    ignore:
      - dependency-name: '@angular-devkit/architect'
        versions: ['>= 0.2200.0']
      - dependency-name: '@angular/*'
        versions: ['>= 22.0.0']
      - dependency-name: '@angular-devkit/*'
        versions: ['>= 0.2200.0 < 1.0.0', '>= 22.0.0']
      - dependency-name: '@gsa-sam/*'
        versions: ['>= 22.0.0']
      - dependency-name: 'angular-eslint'
        versions: ['>= 22.0.0']
      - dependency-name: 'ng-packagr'
        versions: ['>= 22.0.0']
      - dependency-name: 'ngx-markdown'
        versions: ['>= 22.0.0']
      - dependency-name: 'typescript'
        versions: ['>= 6.0.0']
    groups:
      minor:
        patterns:
          - '*'
        update-types:
          - 'minor'
      patch:
        patterns:
          - '*'
        update-types:
          - 'patch'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      github-actions:
        patterns:
          - '*'
