name: Security

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dast:
    name: DAST (medium/high gate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Node packages
        run: npm ci
      - name: Generate API docs (apidoc)
        # The apidoc TypeScript modules libs/documentation imports are generated,
        # not tracked (see .gitignore). Storybook's webpack build fails with TS2307
        # "Cannot find module './components/components'" without this step.
        run: npm run demo:docs
      - name: Build Stackblitz HTMLs
        # Matches the deployed Storybook build (.github/workflows/build.yml) so the
        # scanned runtime has the same asset surface as production.
        run: npm run demo:stackblitzes
      - name: Build production Storybook
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
        run: npm run build-storybook
      - name: Serve production Storybook with security headers
        run: SECURITY_SCAN_ROOT=storybook-static SECURITY_SCAN_HOST=0.0.0.0 node scripts/serve-security-scan.mjs &
      - name: Wait for production Storybook
        run: |
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4200/ >/dev/null && exit 0
            sleep 1
          done
          echo "Production site did not start within 30 seconds" >&2
          exit 1
      - name: Scan runtime with OWASP ZAP
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'http://127.0.0.1:4200'
          fail_action: false
          allow_issue_writing: false
          cmd_options: '-a'
      - name: Enforce medium/high severity gate
        run: node scripts/check-zap-severity.mjs report_json.json .zap/rules.tsv
      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-report
          path: report_*.html
          if-no-files-found: warn
