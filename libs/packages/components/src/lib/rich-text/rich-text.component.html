<div [class.disabled]="disabled">
  <ckeditor
    #editor
    *ngIf="isLayoutReady"
    [editor]="Editor"
    [config]="config"
    [(ngModel)]="model"
    [disabled]="disabled"
    [attr.disabled]="disabled ? '' : null"
    (change)="onChange($event)"
    (blur)="onTouched($event)"
    class="{{ minHeightClass }} {{ maxHeightClass }}"
  >
  </ckeditor>
</div>
